name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Activation server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: server
        run: npm test

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal)
            os: macos-14
            pluginval: pluginval_macOS.zip
            pluginval_bin: pluginval.app/Contents/MacOS/pluginval
            cmake_args: -G Ninja -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows (x64)
            os: windows-2022
            pluginval: pluginval_Windows.zip
            pluginval_bin: pluginval.exe
            cmake_args: -G "Visual Studio 17 2022" -A x64
          - name: Linux (x64)
            os: ubuntu-24.04
            pluginval: pluginval_Linux.zip
            pluginval_bin: pluginval
            cmake_args: -G Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasound2-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev xvfb

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # The interface runs in a Chromium-based WebView2 on Windows. The loader is linked
      # statically from Microsoft's SDK package; the runtime itself ships with Windows.
      - name: Install WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory packages

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA="-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$(cygpath -m "$PWD")/packages"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }} $EXTRA

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate plugin (pluginval)
        shell: bash
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
          unzip -q pluginval.zip
          VST3=$(find build -type d -name "Drenched.vst3" -path "*Release*" | head -n 1)
          [ -n "$VST3" ] || VST3=$(find build -type d -name "Drenched.vst3" | head -n 1)
          echo "Validating $VST3"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./${{ matrix.pluginval_bin }} --strictness-level 10 --skip-gui-tests --validate-in-process --validate "$VST3"
          else
            ./${{ matrix.pluginval_bin }} --strictness-level 10 --skip-gui-tests --validate-in-process --validate "$VST3"
          fi

      - name: Collect plugins
        shell: bash
        run: |
          mkdir -p dist
          find build -path "*_artefacts*" \( -name "*.vst3" -o -name "*.component" -o -name "*.clap" -o -name "*.app" -o -name "Drenched.exe" -o -name "Drenched" -type f \) -prune -exec cp -R {} dist/ \; || true
          ls -la dist

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: Drenched-${{ runner.os }}
          path: dist
          if-no-files-found: warn
