name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, only the interface's random test at full length (200 actions per look).
  schedule:
    - cron: '23 3 * * *'

concurrency:
  # The nightly run is on main's ref too; its own group keeps it from cancelling a push.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'ci' }}
  cancel-in-progress: true

# No job writes to the repository: uploads go through the artifact actions, which need
# no token scope, so the token only reads.
permissions:
  contents: read

jobs:
  server:
    name: Activation server
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tests
        working-directory: server
        run: npm test

  interface:
    name: Interface
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The user guide page the installers ship must match docs/user-guide.md. Here, on
      # the runner itself, because Ubuntu 24.04's pandoc (3.1.3) is the one the committed
      # page is built with (the Linux build's Debian has an older one that writes it
      # differently).
      - name: Check the user guide page is up to date
        run: |
          sudo apt-get install -y --no-install-recommends pandoc > /dev/null
          bash tools/user_guide_html.sh
          git diff --exit-code packaging/user-guide.html || { echo "Run tools/user_guide_html.sh and commit the result"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        working-directory: tests/ui
        run: npm ci && npx playwright install --with-deps chromium
      # The random test: 50 actions per look on a new seed each run, 200 nightly. A failure
      # names the seed; re-running the job keeps the run number, and so the seed.
      - name: Tests
        working-directory: tests/ui
        env:
          DRENCHED_UI_ACTIONS: ${{ github.event_name == 'schedule' && '200' || '50' }}
        run: |
          export DRENCHED_UI_SEED=$(( GITHUB_RUN_NUMBER * 100 ))
          echo "Random test: DRENCHED_UI_SEED=$DRENCHED_UI_SEED DRENCHED_UI_ACTIONS=$DRENCHED_UI_ACTIONS"
          npm test

  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    # Only the Linux build runs in a container (empty elsewhere): see its matrix entry.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal)
            os: macos-15
            artifact: Drenched-macOS
            pluginval: pluginval_macOS.zip
            pluginval_sha256: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
            pluginval_bin: pluginval.app/Contents/MacOS/pluginval
            cmake_args: -G Ninja -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows (x64)
            os: windows-2022
            artifact: Drenched-Windows-x64
            pluginval: pluginval_Windows.zip
            pluginval_sha256: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab
            pluginval_bin: pluginval.exe
            cmake_args: -G "Visual Studio 17 2022" -A x64
          # 32-bit, for older hosts and 32-bit installs of Windows. pluginval only ships
          # 64-bit, and a 64-bit validator can't load a 32-bit plug-in, so a 32-bit copy is
          # built from source (GPL, used as a test tool only; never shipped). The Linux
          # build is also built from source, with patch-pluginval.py's run loop fix.
          - name: Windows (x86, 32-bit)
            os: windows-2022
            artifact: Drenched-Windows-x86
            pluginval: source
            pluginval_bin: pluginval-build/pluginval_artefacts/Release/pluginval.exe
            pluginval_cmake_args: -G "Visual Studio 17 2022" -A Win32
            cmake_args: -G "Visual Studio 17 2022" -A Win32
          # Built on Debian 12, not on the runner's Ubuntu 24.04: a binary needs the C and
          # C++ runtimes of the system it was built on or newer, and 24.04's (glibc 2.38)
          # would shut out Ubuntu 22.04, Debian 12 and Mint 21. check-glibc.sh holds it there.
          - name: Linux (x64)
            os: ubuntu-24.04
            container: debian:bookworm
            artifact: Drenched-Linux-x64
            pluginval: source
            pluginval_bin: pluginval-build/pluginval_artefacts/Release/pluginval
            pluginval_cmake_args: -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake_args: -G Ninja

    steps:
      # Before the checkout: the Debian container has no git, without which the checkout
      # leaves out .git (the build reads its commit from it). Shared with the licence and
      # checks jobs below (YAML aliases), so they stay the same.
      - &linux-dependencies
        name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          SUDO=sudo
          BASE=""
          # In a container: root, no sudo, and none of the runner's tools.
          if [ "$(id -u)" = 0 ]; then
            SUDO=""
            BASE="build-essential cmake git python3 ca-certificates curl pkg-config file xauth"
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends $BASE ninja-build libasound2-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev ladspa-sdk xvfb
          # The checkout belongs to the runner's user, not to the container's root.
          [ -n "$SUDO" ] || git config --global --add safe.directory '*'

      - uses: actions/checkout@v7

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # The interface runs in a Chromium-based WebView2 on Windows. The loader is linked
      # statically from Microsoft's SDK package; the runtime itself ships with Windows.
      - name: Install WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory packages

      # Keyed on the runner image too: the cache holds built tools (juceaide), and a copy
      # built on an older image or compiler must not be restored onto a newer one.
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-${{ matrix.artifact }}-${{ matrix.container || matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA="-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$(cygpath -m "$PWD")/packages"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }} $EXTRA

      # The licence texts the installers ship must match NOTICE.md and the fetched sources.
      - name: Check third-party licences are up to date
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 tools/third_party_licences.py build
          git diff --exit-code packaging/third-party-licences.txt || { echo "Run tools/third_party_licences.py and commit the result"; exit 1; }

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Check the Linux build runs on Ubuntu 22.04 and Debian 12
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/check-glibc.sh build/source/plugin/Drenched_artefacts/Release

      - name: Unit tests
        shell: bash
        run: ctest --test-dir build -C Release --label-exclude "^timing$" --output-on-failure

      # Tests that time the code fail when the runner is busy rather than when the code is
      # slow, so they run on their own and get two more tries before failing.
      - name: Timing tests
        shell: bash
        run: ctest --test-dir build -C Release --label-regex "^timing$" --repeat until-pass:3 --output-on-failure

      - name: Cache pluginval
        if: matrix.pluginval == 'source'
        uses: actions/cache@v6
        with:
          path: pluginval-build/pluginval_artefacts
          key: pluginval-v1.0.4-${{ matrix.artifact }}-${{ matrix.container || matrix.os }}-${{ hashFiles('.github/scripts/patch-pluginval.py') }}

      - name: Build pluginval
        if: matrix.pluginval == 'source'
        shell: bash
        run: |
          [ -f "${{ matrix.pluginval_bin }}" ] && exit 0
          git clone --depth 1 --branch v1.0.4 --recurse-submodules --shallow-submodules \
            https://github.com/Tracktion/pluginval.git pluginval-src
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          $PY .github/scripts/patch-pluginval.py pluginval-src
          cmake -S pluginval-src -B pluginval-build ${{ matrix.pluginval_cmake_args }}
          cmake --build pluginval-build --config Release --parallel

      - name: Validate plugin (pluginval)
        shell: bash
        run: |
          # A fixed release, checked against its SHA-256 before it runs: this job builds
          # the testers' downloads, so a changed binary must stop it, not run in it.
          if [ "${{ matrix.pluginval }}" != "source" ]; then
            curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/${{ matrix.pluginval }}"
            echo "${{ matrix.pluginval_sha256 }}  pluginval.zip" | { if command -v sha256sum >/dev/null; then sha256sum -c -; else shasum -a 256 -c -; fi; }
            unzip -q pluginval.zip
          fi
          file "${{ matrix.pluginval_bin }}" 2>/dev/null || true
          VST3=$(find build -type d -name "Drenched.vst3" -path "*Release*" | head -n 1)
          [ -n "$VST3" ] || VST3=$(find build -type d -name "Drenched.vst3" | head -n 1)
          echo "Validating $VST3"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process --validate "$VST3"
          else
            ./${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process --validate "$VST3"
          fi

      # Without this reason in its Info.plist, macOS gives the app no audio input.
      - name: Check the app asks for the microphone (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(find build -type d -name "Drenched.app" -path "*Release*" | head -n 1)
          plutil -extract NSMicrophoneUsageDescription raw "$APP/Contents/Info.plist"

      # Logic and GarageBand only load Audio Units that pass Apple's auval.
      - name: Validate Audio Unit (auval)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          AU=$(find build -type d -name "Drenched.component" -path "*Release*" | head -n 1)
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$AU" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i drenched || true
          auval -strict -v aufx Drn1 Drnc

      # clap-validator (MIT) ships 64-bit only, so the 32-bit CLAP is left to pluginval's
      # VST3 checks of the same code.
      - name: Validate CLAP (clap-validator)
        if: matrix.pluginval != 'source' || runner.os == 'Linux'
        shell: bash
        run: |
          V=0.3.2
          case "$RUNNER_OS" in
            Linux)   F=clap-validator-$V-ubuntu-18.04.tar.gz;   SUM=1476ed68f5657e76050e0c4f19790c02d819ecc62c35fd465059d21f05169cb1 ;;
            macOS)   F=clap-validator-$V-macos-universal.tar.gz; SUM=3750f3729adfd8489f2b29019f7f2ed65ba71bf9d5049735f6a2ca0fccb18ffd ;;
            Windows) F=clap-validator-$V-windows.zip;           SUM=68cdbe51c05489542b5420a870b7159b4cb352b5ce5c486f9bd8a9b49b75bdda ;;
          esac
          curl -fsSL -o "$F" "https://github.com/free-audio/clap-validator/releases/download/$V/$F"
          echo "$SUM  $F" | { if command -v sha256sum >/dev/null; then sha256sum -c -; else shasum -a 256 -c -; fi; }
          case "$F" in *.zip) unzip -q "$F" ;; *) tar xzf "$F" ;; esac
          CV=$(find . -maxdepth 3 -type f \( -name clap-validator -o -name clap-validator.exe \) | head -n 1)
          CLAP=$(find build -name "Drenched.clap" -path "*Release*" -prune | head -n 1)
          echo "Validating $CLAP with $CV"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$CV" validate "$CLAP"
          else
            "$CV" validate "$CLAP"
          fi

      # The runner is Apple Silicon, so everything above ran the arm64 half of the
      # universal build only. Intel Macs run the other half (SSE, not NEON, in PFFFT):
      # the tests and the three validators again on it, under Rosetta.
      - name: Test and validate the Intel half (macOS, Rosetta)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          for t in build/tests/drenched_tests build/tests/plugin/drenched_plugin_tests; do
            echo "$t: $(lipo -archs "$t")"
            arch -x86_64 "$t" "~[timing]"
          done
          VST3=$(find build -type d -name "Drenched.vst3" -path "*Release*" | head -n 1)
          arch -x86_64 ./${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process --validate "$VST3"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          arch -x86_64 auval -strict -v aufx Drn1 Drnc
          CV=$(find . -maxdepth 3 -type f -name clap-validator | head -n 1)
          CLAP=$(find build -name "Drenched.clap" -path "*Release*" -prune | head -n 1)
          arch -x86_64 "$CV" validate "$CLAP"

      - name: Collect plugins
        shell: bash
        run: |
          mkdir -p dist
          find build -path "*_artefacts*" \( -name "*.vst3" -o -name "*.component" -o -name "*.clap" -o -name "*.app" -o -name "Drenched.exe" -o -name "Drenched" -type f \) -prune -exec cp -R {} dist/ \; || true
          ls -la dist
          # Every format this system builds, or the job stops here rather than at whichever
          # later step happens to need the missing one.
          case "$RUNNER_OS" in
            macOS)   WANT="Drenched.vst3 Drenched.component Drenched.clap Drenched.app" ;;
            Windows) WANT="Drenched.vst3 Drenched.clap Drenched.exe" ;;
            Linux)   WANT="Drenched.vst3 Drenched.clap Drenched" ;;
          esac
          for f in $WANT; do [ -e "dist/$f" ] || { echo "not built: $f"; exit 1; }; done

      # Windows: the folder, which the bundle job downloads. macOS and Linux: one .tar.gz,
      # since a zipped artifact loses the executable bit (the app wouldn't start).
      - name: Upload plugins (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}
          name: ${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

      - name: Pack plugins (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: tar czf "${{ matrix.artifact }}.tar.gz" -C dist .

      - name: Upload plugins (macOS, Linux)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}
          path: ${{ matrix.artifact }}.tar.gz
          archive: false
          if-no-files-found: error

      # The beta installer: one .pkg with each format as a component (not signed yet).
      - name: Build installer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # The run number tells beta drops of the same version apart, in the file names
          # and in the package version (so an install over an older drop is an upgrade).
          VERSION=$(sed -n 's/^project(Drenched VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          bash packaging/macos/build-pkg.sh dist "$VERSION.$GITHUB_RUN_NUMBER" "Drenched-$VERSION-build-$GITHUB_RUN_NUMBER-macOS.pkg"

      # What a tester gets: the package installed as they would install it, every format
      # where hosts look (not moved to the build folder's copies), and the installed Audio
      # Unit passing auval.
      - name: Install and check the installer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf ~/Library/Audio/Plug-Ins/Components/Drenched.component # the copy auval checked above
          sudo installer -pkg Drenched-*-macOS.pkg -target /
          for b in "/Library/Audio/Plug-Ins/VST3/Drenched.vst3" "/Library/Audio/Plug-Ins/Components/Drenched.component" \
                   "/Library/Audio/Plug-Ins/CLAP/Drenched.clap" "/Applications/Drenched.app"; do
            [ -d "$b" ] || { echo "not installed: $b"; exit 1; }
            BIN="$b/Contents/MacOS/Drenched"
            ARCHS=$(lipo -archs "$BIN")
            echo "$b: $ARCHS"
            [[ "$ARCHS" == *x86_64* && "$ARCHS" == *arm64* ]] || { echo "$b is not universal"; exit 1; }
            # Every slice must run on the oldest macOS the guide promises.
            MINOS=$(vtool -show-build "$BIN" | awk '$1 == "minos" { print $2 }' | sort -u)
            echo "$b: minos $MINOS"
            [ "$MINOS" = "11.0" ] || { echo "$b needs macOS $MINOS, not 11.0"; exit 1; }
            codesign --verify --verbose "$b"
          done
          for f in "User guide.html" "Third-party licences.txt"; do
            [ -f "/Library/Application Support/Drenched/$f" ] || { echo "not installed: $f"; exit 1; }
          done
          # Installing over an older build replaces each bundle instead of merging into it:
          # a file left behind would break the bundle's signature.
          sudo touch /Library/Audio/Plug-Ins/VST3/Drenched.vst3/Contents/stray.txt
          sudo installer -pkg Drenched-*-macOS.pkg -target /
          [ ! -e /Library/Audio/Plug-Ins/VST3/Drenched.vst3/Contents/stray.txt ] || { echo "reinstall kept a file the build doesn't have"; exit 1; }
          codesign --verify --verbose /Library/Audio/Plug-Ins/VST3/Drenched.vst3
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -strict -v aufx Drn1 Drnc

      # What testers download: a disk image holding the package and the user guide, since
      # the guide is otherwise only there once Drenched is installed.
      - name: Build disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION=$(sed -n 's/^project(Drenched VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          NAME="Drenched-$VERSION-build-$GITHUB_RUN_NUMBER-macOS"
          mkdir dmg
          cp "$NAME.pkg" dmg/
          cp packaging/user-guide.html "dmg/User guide.html"
          hdiutil create -volname "Drenched $VERSION build $GITHUB_RUN_NUMBER" -srcfolder dmg -fs HFS+ -format UDZO -ov "$NAME.dmg"
          hdiutil verify "$NAME.dmg"
          hdiutil attach -nobrowse -mountpoint dmg-check "$NAME.dmg"
          ls -la dmg-check
          [ -f "dmg-check/$NAME.pkg" ] && [ -f "dmg-check/User guide.html" ] || { echo "disk image is missing a file"; exit 1; }
          hdiutil detach dmg-check

      # Uploaded as the file itself rather than zipped, so it downloads as a .dmg.
      - name: Upload disk image (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}
          path: Drenched-*-macOS.dmg
          archive: false
          if-no-files-found: error

  licence:
    # The trial and the licence. Every other build here is a beta (DRENCHED_BETA=ON),
    # which leaves them out, so this one is configured as a release is and builds just
    # the licence tests (tests/plugin/CMakeLists.txt) and the plugin code they load. The
    # tests sign codes with the published test key, which a release build only accepts
    # with DRENCHED_ALLOW_TEST_LICENCE.
    name: Licence and trial (Linux, release build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - *linux-dependencies

      # Fetched dependencies for builds on the runner itself (the Linux x64 build runs in
      # Debian, so its cache is its own). This job keeps them; the checks jobs only read.
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-Linux-host-ubuntu-24.04-${{ hashFiles('cmake/Dependencies.cmake') }}

      # The guard that stops a release shipping the test key: configured as a real release
      # (no allowance), it must refuse, however the line using the test key is spelt.
      - name: Release guard refuses the test key
        run: |
          for spelling in 'return testKey();' 'return testKey ();' 'return drenched::testKey();'; do
            sed -i "/BEGIN SERVER KEY/{n;s/.*/    $spelling/}" source/licence/src/Licence.cpp
            if cmake -S . -B build-guard -G Ninja -DFETCHCONTENT_BASE_DIR="$PWD/build/_deps" -DDRENCHED_BETA=OFF -DDRENCHED_LICENCE_SERVER=https://example.com > guard.log 2>&1; then
              echo "::error::A release configure with '$spelling' was not refused"; exit 1
            fi
            grep -q "still uses the test licence key" guard.log || { cat guard.log; exit 1; }
            rm -rf build-guard
          done
          git checkout -- source/licence/src/Licence.cpp

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDRENCHED_BETA=OFF -DDRENCHED_ALLOW_TEST_LICENCE=ON

      - name: Build
        run: cmake --build build --target drenched_licence_tests --parallel

      - name: Licence tests
        run: ctest --test-dir build --label-regex "^licence$" --no-tests=error --output-on-failure

  checks:
    # The tests again, built to catch what a Release build can't: the realtime sanitizer
    # stops a test the moment anything marked DRENCHED_NONBLOCKING (processBlock and the
    # reverb's process) allocates, frees, locks or waits; the thread sanitizer finds data
    # races between the audio, message and builder threads; the address and undefined
    # behaviour sanitizers find memory errors and leaks; and the Debug build fails on any
    # jassert or leak JUCE reports that a test didn't ask for (tests/plugin/Main.cpp).
    # Linux only: the code they check is the same on every platform.
    name: ${{ matrix.name }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Realtime sanitizer (Linux)
            build_type: RelWithDebInfo
            sanitize: realtime
            clang: true
          # The tests that run threads against each other; the rest run one thread at a
          # time, and take far longer under this sanitizer for nothing more. One at a
          # time: each stress test already keeps every core busy.
          - name: Thread sanitizer (Linux)
            build_type: RelWithDebInfo
            sanitize: thread
            tests: --label-regex "^(stress|scenes|builder)$" --parallel 1
          - name: Address and undefined behaviour sanitizers (Linux)
            build_type: RelWithDebInfo
            sanitize: address,undefined
          - name: Debug (Linux)
            build_type: Debug
            sanitize: ""

    env:
      RTSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:suppressions=${{ github.workspace }}/tests/ubsan-suppressions.txt

    steps:
      - uses: actions/checkout@v7

      - *linux-dependencies

      # The realtime sanitizer is Clang's, from Clang 20; Ubuntu 24.04 has it in its own
      # updates, with the sanitizer runtimes in libclang-rt-20-dev.
      - name: Install Clang 20
        if: matrix.clang
        run: |
          sudo apt-get install -y --no-install-recommends clang-20 libclang-rt-20-dev
          echo "CC=clang-20" >> "$GITHUB_ENV"
          echo "CXX=clang++-20" >> "$GITHUB_ENV"

      # The licence job's fetched dependencies, only read.
      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: build/_deps
          key: deps-Linux-host-ubuntu-24.04-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DDRENCHED_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build --target drenched_tests drenched_plugin_tests --parallel

      # The timing tests are left out: under a sanitizer they would time the sanitizer.
      - name: Tests
        run: ctest --test-dir build --label-exclude "^timing$" --parallel 2 ${{ matrix.tests }} --no-tests=error --output-on-failure

  linux-i686:
    name: Linux (i686, 32-bit)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Ubuntu no longer has 32-bit GTK and WebKit, so this builds inside an i386
      # Debian container, which has every library JUCE needs.
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            build-i686/_deps
            pluginval-i686/build/pluginval_artefacts
          key: deps-linux-i686-${{ hashFiles('cmake/Dependencies.cmake', '.github/scripts/linux-i686.sh', '.github/scripts/patch-pluginval.py') }}

      - name: Build, test and validate
        run: |
          docker run --rm --platform linux/386 -e GITHUB_RUN_NUMBER -v "$PWD:/src" -w /src debian:bookworm \
            bash .github/scripts/linux-i686.sh build-i686
          sudo chown -R "$(id -u):$(id -g)" build-i686 pluginval-i686

      - name: Collect plugins
        run: |
          mkdir -p dist
          A=build-i686/source/plugin/Drenched_artefacts/Release
          cp -R "$A/VST3/Drenched.vst3" "$A/CLAP/Drenched.clap" "$A/Standalone/Drenched" dist/
          ls -la dist
          tar czf Drenched-Linux-i686.tar.gz -C dist .

      # A .tar.gz, since a zipped artifact loses the executable bit.
      - name: Upload plugins
        uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}
          path: Drenched-Linux-i686.tar.gz
          archive: false
          if-no-files-found: error

  windows-bundle:
    # One download for Windows: a VST3 bundle holding both the 32-bit and 64-bit
    # plug-in (hosts pick the one that matches them), plus both CLAPs and apps.
    name: Windows (32 and 64-bit bundle)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Drenched-Windows-x64
          path: x64

      - uses: actions/download-artifact@v8
        with:
          name: Drenched-Windows-x86
          path: x86

      - name: Merge
        run: |
          mkdir -p dist/CLAP/64-bit dist/CLAP/32-bit
          cp -R x64/Drenched.vst3 dist/
          cp -R x86/Drenched.vst3/Contents/*-win dist/Drenched.vst3/Contents/
          cp x64/Drenched.clap dist/CLAP/64-bit/
          cp x86/Drenched.clap dist/CLAP/32-bit/
          cp x64/Drenched.exe "dist/Drenched.exe"
          cp x86/Drenched.exe "dist/Drenched (32-bit).exe"
          find dist -maxdepth 4 | sort

      - uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}
          name: Drenched-Windows
          path: dist

  windows-installer:
    # The beta installer for Windows, from the merged download: both builds on 64-bit
    # Windows (for 64-bit hosts and 32-bit hosts or bridges), the 32-bit build on 32-bit Windows.
    name: Windows installer
    needs: windows-bundle
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: Drenched-Windows
          path: dist

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^project\(Drenched VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$version" "/DBuild=$env:GITHUB_RUN_NUMBER" "/DSource=$PWD\dist" "/O$PWD\installer" packaging\windows\Drenched.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer

      # What a tester gets: the installer run (silently) as they would run it, each build
      # where its hosts look, then the uninstaller taking it all away again.
      - name: Install, check and uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer\*.exe)[0].FullName
          $run = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=install.log' -Wait -PassThru
          if ($run.ExitCode -ne 0) { Get-Content install.log; exit 1 }

          # The machine type in a Windows binary's header: 0x8664 for x64, 0x14c for x86.
          function Machine ($path) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            return [BitConverter]::ToUInt16($bytes, $pe + 4)
          }

          $cf64 = "${env:CommonProgramFiles}"
          $cf32 = "${env:CommonProgramFiles(x86)}"
          $expected = @(
            @("$cf64\VST3\Drenched.vst3\Contents\x86_64-win\Drenched.vst3", 0x8664),
            @("$cf64\VST3\Drenched.vst3\Contents\x86-win\Drenched.vst3", 0x14c),
            @("$cf32\VST3\Drenched.vst3\Contents\x86-win\Drenched.vst3", 0x14c),
            @("$cf64\CLAP\Drenched.clap", 0x8664),
            @("$cf32\CLAP\Drenched.clap", 0x14c),
            @("${env:ProgramFiles}\Drenched\Drenched.exe", 0x8664))
          foreach ($e in $expected) {
            if (-not (Test-Path $e[0])) { Write-Error "not installed: $($e[0])"; exit 1 }
            $m = Machine $e[0]
            if ($m -ne $e[1]) { Write-Error ("{0} is machine 0x{1:x}, not 0x{2:x}" -f $e[0], $m, $e[1]); exit 1 }
            Write-Host ("{0}: 0x{1:x}" -f $e[0], $m)
          }
          # No Visual C++ runtime DLLs needed: testers may not have the redistributable.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1).FullName
          foreach ($e in $expected) {
            $runtime = @(& $dumpbin /nologo /dependents $e[0] | Where-Object { $_ -match '(vcruntime|msvcp|ucrtbase|api-ms-win-crt)' })
            if ($runtime.Count -ne 0) { Write-Error ("{0} needs {1}" -f $e[0], ($runtime.Trim() -join ', ')); exit 1 }
          }

          foreach ($f in @('User guide.html', 'Third-party licences.txt')) {
            if (-not (Test-Path "${env:ProgramFiles}\Drenched\$f")) { Write-Error "not installed: $f"; exit 1 }
          }

          # The 32-bit folder gets only the 32-bit build, or 64-bit hosts that scan both list Drenched twice.
          if (Test-Path "$cf32\VST3\Drenched.vst3\Contents\x86_64-win") { Write-Error "64-bit build in $cf32\VST3"; exit 1 }

          # A reinstall replaces the bundle instead of merging into it, and takes away the formats left unticked.
          $stray = "$cf64\VST3\Drenched.vst3\Contents\x86_64-win\stray.txt"
          Set-Content $stray 'left by an older build'
          $run = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/COMPONENTS=vst3', '/LOG=reinstall.log' -Wait -PassThru
          if ($run.ExitCode -ne 0) { Get-Content reinstall.log; exit 1 }
          if (Test-Path $stray) { Write-Error "reinstall kept a file the build doesn't have"; exit 1 }
          foreach ($kept in @($expected[0][0], $expected[2][0])) {
            if (-not (Test-Path $kept)) { Write-Error "reinstall lost $kept"; exit 1 }
          }
          foreach ($gone in @("$cf64\CLAP\Drenched.clap", "$cf32\CLAP\Drenched.clap", "${env:ProgramFiles}\Drenched\Drenched.exe")) {
            if (Test-Path $gone) { Write-Error "unticked but still installed: $gone"; exit 1 }
          }

          # The uninstaller hands over to a copy of itself, so wait for the files to go.
          Start-Process "${env:ProgramFiles}\Drenched\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $left = @()
          for ($i = 0; $i -lt 60; $i++) {
            $left = @($expected | ForEach-Object { $_[0] } | Where-Object { Test-Path $_ })
            if ($left.Count -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          if ($left.Count -ne 0) { Write-Error "left behind: $($left -join ', ')"; exit 1 }
          Write-Host "Uninstalled cleanly"

      # Uploaded as the file itself rather than zipped, so it downloads as an .exe.
      - uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}
          path: installer/*.exe
          archive: false
          if-no-files-found: error
