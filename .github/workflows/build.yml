name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Activation server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: server
        run: npm test

  interface:
    name: Interface
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        working-directory: tests/ui
        run: npm ci && npx playwright install --with-deps chromium
      - name: Tests
        working-directory: tests/ui
        run: npm test

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal)
            os: macos-15
            artifact: Drenched-macOS
            pluginval: pluginval_macOS.zip
            pluginval_bin: pluginval.app/Contents/MacOS/pluginval
            cmake_args: -G Ninja -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows (x64)
            os: windows-2022
            artifact: Drenched-Windows-x64
            pluginval: pluginval_Windows.zip
            pluginval_bin: pluginval.exe
            cmake_args: -G "Visual Studio 17 2022" -A x64
          # 32-bit, for older hosts and 32-bit installs of Windows. pluginval only ships
          # 64-bit, and a 64-bit validator can't load a 32-bit plug-in, so a 32-bit copy is
          # built from source (GPL, used as a test tool only; never shipped). The Linux
          # build is also built from source, with patch-pluginval.py's run loop fix.
          - name: Windows (x86, 32-bit)
            os: windows-2022
            artifact: Drenched-Windows-x86
            pluginval: source
            pluginval_bin: pluginval-build/pluginval_artefacts/Release/pluginval.exe
            pluginval_cmake_args: -G "Visual Studio 17 2022" -A Win32
            cmake_args: -G "Visual Studio 17 2022" -A Win32
          - name: Linux (x64)
            os: ubuntu-24.04
            artifact: Drenched-Linux-x64
            pluginval: source
            pluginval_bin: pluginval-build/pluginval_artefacts/Release/pluginval
            pluginval_cmake_args: -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake_args: -G Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasound2-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev ladspa-sdk xvfb

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # The interface runs in a Chromium-based WebView2 on Windows. The loader is linked
      # statically from Microsoft's SDK package; the runtime itself ships with Windows.
      - name: Install WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory packages

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.artifact }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA="-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$(cygpath -m "$PWD")/packages"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }} $EXTRA

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Cache pluginval
        if: matrix.pluginval == 'source'
        uses: actions/cache@v4
        with:
          path: pluginval-build/pluginval_artefacts
          key: pluginval-v1.0.4-${{ matrix.artifact }}-${{ hashFiles('.github/scripts/patch-pluginval.py') }}

      - name: Build pluginval
        if: matrix.pluginval == 'source'
        shell: bash
        run: |
          [ -f "${{ matrix.pluginval_bin }}" ] && exit 0
          git clone --depth 1 --branch v1.0.4 --recurse-submodules --shallow-submodules \
            https://github.com/Tracktion/pluginval.git pluginval-src
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          $PY .github/scripts/patch-pluginval.py pluginval-src
          cmake -S pluginval-src -B pluginval-build ${{ matrix.pluginval_cmake_args }}
          cmake --build pluginval-build --config Release --parallel

      - name: Validate plugin (pluginval)
        shell: bash
        run: |
          if [ "${{ matrix.pluginval }}" != "source" ]; then
            curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
            unzip -q pluginval.zip
          fi
          file "${{ matrix.pluginval_bin }}" 2>/dev/null || true
          VST3=$(find build -type d -name "Drenched.vst3" -path "*Release*" | head -n 1)
          [ -n "$VST3" ] || VST3=$(find build -type d -name "Drenched.vst3" | head -n 1)
          echo "Validating $VST3"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process --validate "$VST3"
          else
            ./${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process --validate "$VST3"
          fi

      # Without this reason in its Info.plist, macOS gives the app no audio input.
      - name: Check the app asks for the microphone (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(find build -type d -name "Drenched.app" -path "*Release*" | head -n 1)
          plutil -extract NSMicrophoneUsageDescription raw "$APP/Contents/Info.plist"

      # Logic and GarageBand only load Audio Units that pass Apple's auval.
      - name: Validate Audio Unit (auval)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          AU=$(find build -type d -name "Drenched.component" -path "*Release*" | head -n 1)
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$AU" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i drenched || true
          auval -strict -v aufx Drn1 Drnc

      # clap-validator (MIT) ships 64-bit only, so the 32-bit CLAP is left to pluginval's
      # VST3 checks of the same code.
      - name: Validate CLAP (clap-validator)
        if: matrix.pluginval != 'source' || runner.os == 'Linux'
        shell: bash
        run: |
          V=0.3.2
          case "$RUNNER_OS" in
            Linux)   curl -fsSL -o cv.tgz "https://github.com/free-audio/clap-validator/releases/download/$V/clap-validator-$V-ubuntu-18.04.tar.gz"; tar xzf cv.tgz ;;
            macOS)   curl -fsSL -o cv.tgz "https://github.com/free-audio/clap-validator/releases/download/$V/clap-validator-$V-macos-universal.tar.gz"; tar xzf cv.tgz ;;
            Windows) curl -fsSL -o cv.zip "https://github.com/free-audio/clap-validator/releases/download/$V/clap-validator-$V-windows.zip"; unzip -q cv.zip ;;
          esac
          CV=$(find . -maxdepth 3 -type f \( -name clap-validator -o -name clap-validator.exe \) | head -n 1)
          CLAP=$(find build -name "Drenched.clap" -path "*Release*" -prune | head -n 1)
          echo "Validating $CLAP with $CV"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$CV" validate "$CLAP"
          else
            "$CV" validate "$CLAP"
          fi

      - name: Collect plugins
        shell: bash
        run: |
          mkdir -p dist
          find build -path "*_artefacts*" \( -name "*.vst3" -o -name "*.component" -o -name "*.clap" -o -name "*.app" -o -name "Drenched.exe" -o -name "Drenched" -type f \) -prune -exec cp -R {} dist/ \; || true
          ls -la dist

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
          if-no-files-found: warn

      # The beta installer: one .pkg with each format as a component (not signed yet).
      - name: Build installer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION=$(sed -n 's/^project(Drenched VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          bash packaging/macos/build-pkg.sh dist "$VERSION" "Drenched-$VERSION-macOS.pkg"

      # What a tester gets: the package installed as they would install it, every format
      # where hosts look (not moved to the build folder's copies), and the installed Audio
      # Unit passing auval.
      - name: Install and check the installer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf ~/Library/Audio/Plug-Ins/Components/Drenched.component # the copy auval checked above
          sudo installer -pkg Drenched-*-macOS.pkg -target /
          for b in "/Library/Audio/Plug-Ins/VST3/Drenched.vst3" "/Library/Audio/Plug-Ins/Components/Drenched.component" \
                   "/Library/Audio/Plug-Ins/CLAP/Drenched.clap" "/Applications/Drenched.app"; do
            [ -d "$b" ] || { echo "not installed: $b"; exit 1; }
            BIN="$b/Contents/MacOS/Drenched"
            ARCHS=$(lipo -archs "$BIN")
            echo "$b: $ARCHS"
            [[ "$ARCHS" == *x86_64* && "$ARCHS" == *arm64* ]] || { echo "$b is not universal"; exit 1; }
            codesign --verify --verbose "$b"
          done
          for f in "User guide.html" "Third-party licences.txt"; do
            [ -f "/Library/Application Support/Drenched/$f" ] || { echo "not installed: $f"; exit 1; }
          done
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -strict -v aufx Drn1 Drnc

      # What testers download: a disk image holding the package and the user guide, since
      # the guide is otherwise only there once Drenched is installed.
      - name: Build disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION=$(sed -n 's/^project(Drenched VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir dmg
          cp "Drenched-$VERSION-macOS.pkg" dmg/
          cp packaging/user-guide.html "dmg/User guide.html"
          hdiutil create -volname "Drenched $VERSION" -srcfolder dmg -fs HFS+ -format UDZO -ov "Drenched-$VERSION-macOS.dmg"
          hdiutil verify "Drenched-$VERSION-macOS.dmg"
          hdiutil attach -nobrowse -mountpoint dmg-check "Drenched-$VERSION-macOS.dmg"
          ls -la dmg-check
          [ -f "dmg-check/Drenched-$VERSION-macOS.pkg" ] && [ -f "dmg-check/User guide.html" ] || { echo "disk image is missing a file"; exit 1; }
          hdiutil detach dmg-check

      # Uploaded as the file itself rather than zipped, so it downloads as a .dmg.
      - name: Upload disk image (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          path: Drenched-*-macOS.dmg
          archive: false
          if-no-files-found: error

  linux-i686:
    name: Linux (i686, 32-bit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Ubuntu no longer has 32-bit GTK and WebKit, so this builds inside an i386
      # Debian container, which has every library JUCE needs.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            build-i686/_deps
            pluginval-i686/build/pluginval_artefacts
          key: deps-linux-i686-${{ hashFiles('cmake/Dependencies.cmake', '.github/scripts/linux-i686.sh', '.github/scripts/patch-pluginval.py') }}

      - name: Build, test and validate
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/src" -w /src debian:bookworm \
            bash .github/scripts/linux-i686.sh build-i686
          sudo chown -R "$(id -u):$(id -g)" build-i686 pluginval-i686

      - name: Collect plugins
        run: |
          mkdir -p dist
          A=build-i686/source/plugin/Drenched_artefacts/Release
          cp -R "$A/VST3/Drenched.vst3" "$A/CLAP/Drenched.clap" "$A/Standalone/Drenched" dist/
          ls -la dist

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: Drenched-Linux-i686
          path: dist

  windows-bundle:
    # One download for Windows: a VST3 bundle holding both the 32-bit and 64-bit
    # plug-in (hosts pick the one that matches them), plus both CLAPs and apps.
    name: Windows (32 and 64-bit bundle)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Drenched-Windows-x64
          path: x64

      - uses: actions/download-artifact@v4
        with:
          name: Drenched-Windows-x86
          path: x86

      - name: Merge
        run: |
          mkdir -p dist/CLAP/64-bit dist/CLAP/32-bit
          cp -R x64/Drenched.vst3 dist/
          cp -R x86/Drenched.vst3/Contents/*-win dist/Drenched.vst3/Contents/
          cp x64/Drenched.clap dist/CLAP/64-bit/
          cp x86/Drenched.clap dist/CLAP/32-bit/
          cp x64/Drenched.exe "dist/Drenched.exe"
          cp x86/Drenched.exe "dist/Drenched (32-bit).exe"
          find dist -maxdepth 4 | sort

      - uses: actions/upload-artifact@v4
        with:
          name: Drenched-Windows
          path: dist

  windows-installer:
    # The beta installer for Windows, from the merged download: both builds on 64-bit
    # Windows (for 64-bit hosts and 32-bit hosts or bridges), the 32-bit build on 32-bit Windows.
    name: Windows installer
    needs: windows-bundle
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Drenched-Windows
          path: dist

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^project\(Drenched VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$version" "/DSource=$PWD\dist" "/O$PWD\installer" packaging\windows\Drenched.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer

      # What a tester gets: the installer run (silently) as they would run it, each build
      # where its hosts look, then the uninstaller taking it all away again.
      - name: Install, check and uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer\*.exe)[0].FullName
          $run = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=install.log' -Wait -PassThru
          if ($run.ExitCode -ne 0) { Get-Content install.log; exit 1 }

          # The machine type in a Windows binary's header: 0x8664 for x64, 0x14c for x86.
          function Machine ($path) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            return [BitConverter]::ToUInt16($bytes, $pe + 4)
          }

          $cf64 = "${env:CommonProgramFiles}"
          $cf32 = "${env:CommonProgramFiles(x86)}"
          $expected = @(
            @("$cf64\VST3\Drenched.vst3\Contents\x86_64-win\Drenched.vst3", 0x8664),
            @("$cf64\VST3\Drenched.vst3\Contents\x86-win\Drenched.vst3", 0x14c),
            @("$cf32\VST3\Drenched.vst3\Contents\x86-win\Drenched.vst3", 0x14c),
            @("$cf64\CLAP\Drenched.clap", 0x8664),
            @("$cf32\CLAP\Drenched.clap", 0x14c),
            @("${env:ProgramFiles}\Drenched\Drenched.exe", 0x8664))
          foreach ($e in $expected) {
            if (-not (Test-Path $e[0])) { Write-Error "not installed: $($e[0])"; exit 1 }
            $m = Machine $e[0]
            if ($m -ne $e[1]) { Write-Error ("{0} is machine 0x{1:x}, not 0x{2:x}" -f $e[0], $m, $e[1]); exit 1 }
            Write-Host ("{0}: 0x{1:x}" -f $e[0], $m)
          }
          foreach ($f in @('User guide.html', 'Third-party licences.txt')) {
            if (-not (Test-Path "${env:ProgramFiles}\Drenched\$f")) { Write-Error "not installed: $f"; exit 1 }
          }

          # The uninstaller hands over to a copy of itself, so wait for the files to go.
          Start-Process "${env:ProgramFiles}\Drenched\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $left = @()
          for ($i = 0; $i -lt 60; $i++) {
            $left = @($expected | ForEach-Object { $_[0] } | Where-Object { Test-Path $_ })
            if ($left.Count -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          if ($left.Count -ne 0) { Write-Error "left behind: $($left -join ', ')"; exit 1 }
          Write-Host "Uninstalled cleanly"

      # Uploaded as the file itself rather than zipped, so it downloads as an .exe.
      - uses: actions/upload-artifact@v7
        with:
          path: installer/*.exe
          archive: false
          if-no-files-found: error
